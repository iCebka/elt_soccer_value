        country_code VARCHAR,
        confederation VARCHAR,
        team_image_url VARCHAR,
        squad_size VARCHAR,
        average_age VARCHAR,
        foreigners_number VARCHAR,
        foreigners_percentage VARCHAR,
        total_market_value VARCHAR,
        coach_name VARCHAR,
        fifa_ranking VARCHAR,
        last_season VARCHAR,
        url VARCHAR,
        _source_file VARCHAR,
        _source_row_number NUMBER,
