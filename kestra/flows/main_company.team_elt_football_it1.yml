    sql: |
      CREATE TABLE IF NOT EXISTS
      {{ envs.snowflake_database }}.{{ envs.snowflake_bronze_schema }}.COMPETITIONS (
        competition_id VARCHAR,
        competition_code VARCHAR,
        name VARCHAR,
        sub_type VARCHAR,
        type VARCHAR,
        country_id VARCHAR,
        country_name VARCHAR,
        domestic_league_code VARCHAR,
        confederation VARCHAR,
        total_clubs VARCHAR,
        url VARCHAR,
        _source_file VARCHAR,
        _source_row_number NUMBER,
        _ingested_at TIMESTAMP_TZ
      )

