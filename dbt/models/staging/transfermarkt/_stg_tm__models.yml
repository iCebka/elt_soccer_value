version: 2

models:
  - name: stg_tm__players
    description: Typed player rows from the manifest-selected complete snapshot.
    columns:
      - {name: player_id, description: Numeric player identifier; invalid values remain NULL.}
      - {name: market_value_eur, description: "Source numeric euros as NUMBER(38,2); missing stays NULL."}
      - {name: raw_record, description: Original VARIANT retained for conversion diagnostics.}
      - {name: source_version_checksum, description: Manifest-selected source SHA-256.}
  - name: stg_tm__player_valuations
    description: Typed valuation history; no latest-per-player filtering is applied.
    columns:
      - {name: player_id, description: Player identifier.}
      - {name: valuation_date, description: Business date from source date, not capture time.}
      - {name: market_value_eur, description: "Source value in euros as NUMBER(38,2)."}
      - {name: source_captured_at, description: Real source capture timestamp.}
  - name: stg_tm__national_teams
    description: Typed national-team snapshot with numeric euro totals.
    columns:
      - {name: national_team_id, description: National-team identifier.}
      - {name: total_market_value_eur, description: Numeric source euros; missing stays NULL.}
  - name: stg_tm__countries
    description: Typed country reference rows.
    columns:
      - {name: country_id, description: Country identifier.}
  - name: stg_tm__games
    description: Typed games with event date kept separate from source capture/load timestamps.
    columns:
      - {name: game_id, description: Game identifier.}
      - {name: game_date, description: Match business date.}
      - {name: source_captured_at, description: Source capture timestamp.}
  - name: stg_tm__competitions
    description: Trimmed competition reference rows; alphanumeric IDs remain VARCHAR.
    columns:
      - {name: competition_id, description: Alphanumeric competition identifier.}
  - name: stg_tm__clubs
    description: Typed clubs, including a suffix-aware parser for observed net-transfer text.
    columns:
      - {name: club_id, description: Club identifier.}
      - {name: net_transfer_record_raw, description: Original observed € text with k/m/bn suffix.}
      - {name: net_transfer_record_eur, description: Parsed signed euros; negative balances are valid.}
  - name: stg_tm__appearances
    description: Typed player-match appearances.
    columns:
      - {name: appearance_id, description: Source appearance identifier.}
      - {name: appearance_date, description: Appearance business date.}
  - name: stg_tm__club_games
    description: Typed club perspective for each game.
    columns:
      - {name: game_id, description: Game identifier.}
      - {name: club_id, description: Perspective club identifier.}
      - {name: is_win, description: Boolean parsed from observed 0/1.}
  - name: stg_tm__transfers
    description: Typed transfers; from/to club can be absent for non-club moves.
    columns:
      - {name: transfer_date, description: Transfer business date.}
      - {name: transfer_fee_eur, description: Numeric source euros; missing stays NULL.}
  - name: stg_tm__game_events
    description: Typed game events with original event label retained for aliasing.
    columns:
      - {name: game_event_id, description: Source event identifier.}
      - {name: event_date, description: Event business date.}
  - name: stg_tm__game_lineups
    description: Typed lineup entries with original lineup label retained for aliasing.
    columns:
      - {name: game_lineup_id, description: Source lineup identifier.}
      - {name: lineup_date, description: Lineup business date.}

  # Every staging model also carries source_file, source_version_checksum,
  # source_version, source_row_number, bronze_ingestion_run_id,
  # source_captured_at, source_checked_at, bronze_loaded_at and raw_record.
