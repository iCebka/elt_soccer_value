version: 2

models:
  - name: base_tm__players
    description: Accepted, exactly deduplicated players with observed position aliases applied.
    columns:
      - name: player_id
        data_tests:
          - not_null
          - unique
          - column_is_type:
              arguments: {expected_type: NUMBER}
      - name: current_club_id
        data_tests:
          - relationships:
              arguments: {to: "ref('base_tm__clubs')", field: club_id}
              config: {severity: warn}
      - {name: source_version_checksum, data_tests: [not_null]}
      - {name: silver_processed_at, data_tests: [not_null]}

  - name: base_tm__player_valuations
    description: Full accepted valuation history; never reduced to latest per player.
    data_tests:
      - unique_combination_of_columns:
          arguments: {combination_of_columns: [player_id, valuation_date]}
    columns:
      - name: player_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('base_tm__players')", field: player_id}
              config: {severity: warn}
      - name: valuation_date
        data_tests:
          - not_null
          - column_is_type:
              arguments: {expected_type: DATE}
      - name: market_value_eur
        data_tests:
          - not_null
          - column_is_type:
              arguments: {expected_type: NUMBER}
  - name: base_tm__national_teams
    description: Accepted national teams.
    columns:
      - {name: national_team_id, data_tests: [not_null, unique]}
      - name: country_id
        data_tests:
          - relationships:
              arguments: {to: "ref('base_tm__countries')", field: country_id}
              config: {severity: warn}

  - name: base_tm__countries
    description: Accepted countries.
    columns:
      - {name: country_id, data_tests: [not_null, unique]}

  - name: base_tm__games
    description: Accepted games.
    columns:
      - {name: game_id, data_tests: [not_null, unique]}
      - name: competition_id
        data_tests:
          - relationships:
              arguments: {to: "ref('base_tm__competitions')", field: competition_id}
              config: {severity: warn}
      - name: home_club_id
        data_tests:
          - relationships:
              arguments: {to: "ref('base_tm__clubs')", field: club_id}
              config: {severity: warn}
      - name: away_club_id
        data_tests:
          - relationships:
              arguments: {to: "ref('base_tm__clubs')", field: club_id}
              config: {severity: warn}

  - name: base_tm__competitions
    description: Accepted competitions.
    columns:
      - {name: competition_id, data_tests: [not_null, unique]}

  - name: base_tm__clubs
    description: Accepted clubs; negative net transfer balances remain valid.
    columns:
      - {name: club_id, data_tests: [not_null, unique]}

  - name: base_tm__appearances
    description: Accepted player-match appearances.
    columns:
      - {name: appearance_id, data_tests: [not_null, unique]}
      - name: game_id
        data_tests:
          - relationships:
              arguments: {to: "ref('base_tm__games')", field: game_id}
              config: {severity: warn}
      - name: player_id
        data_tests:
          - relationships:
              arguments: {to: "ref('base_tm__players')", field: player_id}
              config: {severity: warn}

  - name: base_tm__club_games
    description: Accepted club-game perspectives.
    data_tests:
      - unique_combination_of_columns:
          arguments: {combination_of_columns: [game_id, club_id]}
    columns:
      - {name: game_id, data_tests: [not_null]}
      - {name: club_id, data_tests: [not_null]}
      - name: hosting
        data_tests:
          - accepted_values:
              arguments: {values: [home, away]}

  - name: base_tm__transfers
    description: Accepted distinct transfer records; no unobserved synthetic event key is asserted.
    columns:
      - {name: player_id, data_tests: [not_null]}
      - {name: transfer_date, data_tests: [not_null]}

  - name: base_tm__game_events
    description: Accepted events with aliases applied.
    columns:
      - {name: game_event_id, data_tests: [not_null, unique]}
      - name: game_id
        data_tests:
          - relationships:
              arguments: {to: "ref('base_tm__games')", field: game_id}
              config: {severity: warn}

  - name: base_tm__game_lineups
    description: Accepted lineup records with aliases applied.
    columns:
      - {name: game_lineup_id, data_tests: [not_null, unique]}
      - name: game_id
        data_tests:
          - relationships:
              arguments: {to: "ref('base_tm__games')", field: game_id}
              config: {severity: warn}
