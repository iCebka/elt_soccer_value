version: 2

models:
  - name: silver_games_enriched
    description: >-
      One row per game_id from the manifest-selected games snapshot. Competition,
      home-club and away-club lookups are optional LEFT JOIN enrichments. Names,
      managers, formations and positions from games describe the game record;
      club-catalog attributes are explicitly labelled current_snapshot and must
      not be interpreted as historical as-of attributes.
    columns:
      - name: game_id
        description: Transfermarkt game identifier and grain of this model.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments: {to: "ref('base_tm__games')", field: game_id}
      - name: game_date
        description: Date of the game, distinct from all source capture timestamps.
        data_tests:
          - not_null
          - column_is_type:
              arguments: {expected_type: DATE}
      - name: competition_id
        description: Competition ID as recorded by games, retained when unresolved.
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('base_tm__competitions')", field: competition_id}
              config: {severity: warn}
      - name: resolved_competition_id
        description: Competition ID only when the selected catalog contains it.
        data_tests:
          - relationships:
              arguments: {to: "ref('base_tm__competitions')", field: competition_id}
      - name: competition_type_at_game
        description: Competition type stored on the historical game row.
      - name: competition_type_snapshot
        description: Type from the manifest-selected competitions catalog.
      - name: competition_country_id
        description: Transfermarkt country ID from the competitions catalog; not an ISO code.
      - name: competition_country_name
        description: Optional country label from the competitions catalog.
      - name: competition_resolution_status
        data_tests:
          - accepted_values:
              arguments: {values: [missing_source_id, matched_id, not_found]}
      - name: home_club_id
        description: Home participant ID from games; national teams may use this field too.
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('base_tm__clubs')", field: club_id}
              config: {severity: warn}
      - name: resolved_home_club_id
        data_tests:
          - relationships:
              arguments: {to: "ref('base_tm__clubs')", field: club_id}
      - name: home_club_name_at_game
        description: Home participant name carried by games; preferred for game history.
      - name: home_club_name_current_snapshot
        description: Name from the selected clubs snapshot, NULL when not resolved.
      - name: home_club_resolution_status
        data_tests:
          - accepted_values:
              arguments: {values: [missing_source_id, matched_id, not_found]}
      - name: away_club_id
        description: Away participant ID from games; national teams may use this field too.
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('base_tm__clubs')", field: club_id}
              config: {severity: warn}
      - name: resolved_away_club_id
        data_tests:
          - relationships:
              arguments: {to: "ref('base_tm__clubs')", field: club_id}
      - name: away_club_name_at_game
        description: Away participant name carried by games; preferred for game history.
      - name: away_club_name_current_snapshot
        description: Name from the selected clubs snapshot, NULL when not resolved.
      - name: away_club_resolution_status
        data_tests:
          - accepted_values:
              arguments: {values: [missing_source_id, matched_id, not_found]}
      - name: home_club_goals
        description: Home score recorded for the game; observed as non-negative and present.
        data_tests: [not_null]
      - name: away_club_goals
        description: Away score recorded for the game; observed as non-negative and present.
        data_tests: [not_null]
      - name: home_manager_name_at_game
        description: Optional manager name stored on games, not the current clubs coach.
      - name: away_manager_name_at_game
        description: Optional manager name stored on games, not the current clubs coach.
      - name: games_source_version_checksum
        data_tests: [not_null]
      - name: competitions_source_version_checksum
        data_tests: [not_null]
      - name: clubs_source_version_checksum
        data_tests: [not_null]
      - name: silver_processed_at
        description: Silver processing timestamp; not a game or capture date.
        data_tests: [not_null]
