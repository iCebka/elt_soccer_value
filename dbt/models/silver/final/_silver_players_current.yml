version: 2

models:
  - name: silver_players_current
    description: >-
      One row per player_id for the manifest-selected current snapshots. Country
      of birth, citizenship and national-team country are separate roles.
      Current club, team, market value, contract, cumulative internationals and
      FIFA ranking are snapshot context, not historical as-of attributes. This
      is the one-to-one player dimension consumed by the valuation model.
    data_tests:
      - expression_is_true:
          arguments:
            expression: player_id is not null
    columns:
      - name: player_id
        description: Transfermarkt source player identifier.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments: {to: "ref('base_tm__players')", field: player_id}
      - name: country_of_birth_source
        description: Original player birth-country text, retained without inference.
      - name: birth_country_id
        description: Resolved Transfermarkt country identifier; it is not assumed to be ISO.
        data_tests:
          - relationships:
              arguments: {to: "ref('base_tm__countries')", field: country_id}
      - name: birth_country_resolution_status
        data_tests:
          - accepted_values:
              arguments: {values: [missing, matched_name, matched_alias, not_found, ambiguous]}
      - name: country_of_citizenship_source
        description: Original scalar citizenship text from players.
      - name: citizenship_country_id
        description: Resolved Transfermarkt country identifier; it is not assumed to be ISO.
        data_tests:
          - relationships:
              arguments: {to: "ref('base_tm__countries')", field: country_id}
      - name: citizenship_country_resolution_status
        data_tests:
          - accepted_values:
              arguments: {values: [missing, matched_name, matched_alias, not_found, ambiguous]}
      - name: current_club_id
        description: Current-club source ID from the players snapshot, even when unresolved.
        data_tests:
          - relationships:
              arguments: {to: "ref('base_tm__clubs')", field: club_id}
              config: {severity: warn}
      - name: resolved_current_club_id
        data_tests:
          - relationships:
              arguments: {to: "ref('base_tm__clubs')", field: club_id}
      - name: current_club_resolution_status
        data_tests:
          - accepted_values:
              arguments: {values: [missing_source_id, matched_id, not_found]}
      - name: current_national_team_id
        description: Source ID used only in the documented player-to-team join.
        data_tests:
          - relationships:
              arguments: {to: "ref('base_tm__national_teams')", field: national_team_id}
              config: {severity: warn}
      - name: resolved_current_national_team_id
        data_tests:
          - relationships:
              arguments: {to: "ref('base_tm__national_teams')", field: national_team_id}
      - name: current_national_team_resolution_status
        data_tests:
          - accepted_values:
              arguments: {values: [missing_source_id, matched_id, not_found]}
      - name: national_team_country_id
        description: Resolved Transfermarkt country ID joined through national_teams.country_id.
        data_tests:
          - relationships:
              arguments: {to: "ref('base_tm__countries')", field: country_id}
      - name: national_team_country_resolution_status
        data_tests:
          - accepted_values:
              arguments:
                values: [not_applicable, national_team_not_found, missing_source_id, matched_id, not_found]
      - name: current_market_value_eur
        description: Current value in the selected players snapshot; missing remains NULL.
      - name: current_contract_expiration_date
        description: Contract context from the selected players snapshot.
      - name: cumulative_international_caps
        description: Cumulative source total as of the selected players snapshot.
      - name: cumulative_international_goals
        description: Cumulative source total as of the selected players snapshot.
      - name: current_national_team_fifa_ranking
        description: Ranking from the selected national-teams snapshot.
      - {name: players_source_version_checksum, data_tests: [not_null]}
      - {name: national_teams_source_version_checksum, data_tests: [not_null]}
      - {name: countries_source_version_checksum, data_tests: [not_null]}
      - {name: clubs_source_version_checksum, data_tests: [not_null]}
      - {name: silver_processed_at, data_tests: [not_null]}

