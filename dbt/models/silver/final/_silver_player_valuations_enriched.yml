version: 2

models:
  - name: silver_player_valuations_enriched
    description: >-
      Full valuation history at one row per (player_id, valuation_date), enriched
      by LEFT JOIN to the one-row player current snapshot. Historical valuation
      value and date remain facts. Every variable player/team/country attribute
      is labelled snapshot and must not be interpreted as known at valuation_date.
    data_tests:
      - unique_combination_of_columns:
          arguments: {combination_of_columns: [player_id, valuation_date]}
    columns:
      - name: player_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('silver_players_current')", field: player_id}
              config: {severity: warn}
      - name: valuation_date
        data_tests:
          - not_null
          - column_is_type:
              arguments: {expected_type: DATE}
      - name: historical_market_value_eur
        description: Historical EUR value from player_valuations; zero is valid and NULL is not substituted.
        data_tests:
          - not_null
          - column_is_type:
              arguments: {expected_type: NUMBER}
      - name: valuation_source_current_club_id
        description: Field named current_club_id by the valuation source; not asserted as historical as-of club.
      - name: valuation_source_current_club_name
        description: Field named current_club_name by the valuation source; retained without temporal inference.
      - name: resolved_player_id
        data_tests:
          - relationships:
              arguments: {to: "ref('silver_players_current')", field: player_id}
      - name: player_profile_join_status
        data_tests:
          - accepted_values:
              arguments: {values: [matched_player_id, not_found]}
      - name: age_at_valuation_years
        description: Completed years from date of birth, adjusted around the birthday; NULL when not calculable.
      - name: age_at_valuation_status
        data_tests:
          - accepted_values:
              arguments: {values: [calculated, missing_birth_date, valuation_before_birth, profile_not_found]}
      - name: current_club_id_comparison_status
        data_tests:
          - accepted_values:
              arguments: {values: [match, mismatch, missing_both, valuation_source_missing, player_snapshot_missing, profile_not_found]}
      - name: player_current_market_value_eur_snapshot
        description: Current value from players snapshot; distinct from historical_market_value_eur.
      - name: player_highest_market_value_eur_snapshot
        description: Snapshot attribute, not a reconstructed maximum as of valuation_date.
      - name: player_current_contract_expiration_date_snapshot
        description: Current snapshot context, not an as-of valuation contract.
      - name: current_national_team_fifa_ranking_snapshot
        description: Ranking from the selected national-teams snapshot, not historical ranking.
      - {name: valuations_source_version_checksum, data_tests: [not_null]}
      - {name: players_source_version_checksum, data_tests: [not_null]}
      - {name: national_teams_source_version_checksum, data_tests: [not_null]}
      - {name: countries_source_version_checksum, data_tests: [not_null]}
      - {name: clubs_source_version_checksum, data_tests: [not_null]}
      - {name: silver_processed_at, data_tests: [not_null]}
