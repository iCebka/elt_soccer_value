version: 2

seeds:
  - name: tm_position_aliases
    description: Observed player position labels; Missing intentionally maps to NULL.
    columns:
      - {name: source_value, data_tests: [not_null, unique]}
  - name: tm_event_type_aliases
    description: Observed event labels normalized to singular lowercase values.
    columns:
      - {name: source_value, data_tests: [not_null, unique]}
      - {name: canonical_value, data_tests: [not_null]}
  - name: tm_lineup_type_aliases
    description: Observed lineup labels normalized for downstream joins.
    columns:
      - {name: source_value, data_tests: [not_null, unique]}
      - {name: canonical_value, data_tests: [not_null]}
  - name: tm_country_name_aliases
    description: >-
      Explicit country-name variants observed in players and justified against
      exactly one canonical name in the ingested countries catalog. It is not
      a fuzzy-match dictionary.
    columns:
      - {name: alias_name, data_tests: [not_null, unique]}
      - {name: canonical_country_name, data_tests: [not_null]}
      - {name: rationale, data_tests: [not_null]}
